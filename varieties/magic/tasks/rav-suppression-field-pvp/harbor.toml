  "varieties/magic/tasks/rav-suppression-field-pvp/features.toml",
  "varieties/magic/tasks/rav-suppression-field-pvp/harbor.toml",
]
stub_expected_diagnostic = "Suppression Field candidate cost modifier must add exactly {2} to nonmana abilities"

[mutation]
find = "ActivatedAbilityCostModifier::IncreaseGeneric {\n            amount: 2,\n            nonmana_only: true,\n        }"
