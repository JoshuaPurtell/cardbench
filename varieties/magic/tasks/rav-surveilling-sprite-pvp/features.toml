[[features]]
id = "cast-and-flying-evasion"
summary = "Pay exactly {1}{U}, resolve Surveilling Sprite, and attack over a live Lurking Informant that can block; the opponent leaves it unblocked because it has Flying."
trace_required = true

[[features]]
id = "char-damage-and-dies-trigger"
summary = "The opponent pays {2}{R} for Char and deals four damage to the same Sprite. Verify the lethal-damage state-based action, graveyard move, and optional trigger stacking only after the dies event."
trace_required = true

[[features]]
id = "accepted-and-declined-draw"
summary = "Use two deterministic ordinary shuffled games to resolve the optional trigger once by drawing a card and once by declining; the source is already in the graveyard and accepted card movement precedes ability resolution."
trace_required = true

[[features]]
id = "terminal-pvp-and-mutations"
summary = "Both shuffled games end in a clean seat-zero win. In-game mutations remove Flying, change the casting cost or power, remove the trigger or draw effect, and make the trigger mandatory; each must be detected."
trace_required = true

