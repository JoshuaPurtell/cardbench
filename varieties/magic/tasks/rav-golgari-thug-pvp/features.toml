[[features]]
id = "identity-and-candidate-owned-trigger"
summary = "Define RAV #87 as a black {1}{B} 1/1 creature with Dredge 4 and a candidate-owned Dies trigger requiring one creature card in the trigger controller's graveyard and putting the selected card on its owner's library top. Human Warrior remains printed identity but is not modeled by CardDefinition."
trace_required = true

[[features]]
id = "death-target-controller-zone-and-library-top"
summary = "In legal combat, the pilot's Thug dies to the opposing Watchwolf. Its controller explicitly selects the exact earlier Brownscale card in their own graveyard; resolve the trigger, prove that exact object moves to its owner's library top, and bind the decision to the Thug controller's seat and source incarnation."
trace_required = true

[[features]]
id = "exact-dredge-four-and-recast-terminal-game"
summary = "Replace a later actual draw with Dredge 4 from the same Thug object. Verify exactly four library objects mill in order, with the selected top card first, then return and recast the same Thug object before the normal terminal duel result. Detect mutations to identity, cost, body, Dredge presence/count, trigger condition, target requirement, effect, and a compile-valid injected side effect."
trace_required = true

[[features]]
id = "pre-call-normalized-source-guard"
summary = "Require a canonical parsed AST match to the literal candidate module before either candidate function is called; report rejection of a compile-valid injected side-effect candidate."
trace_required = true

