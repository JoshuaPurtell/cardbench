[[features]]
id = "nontargeting-entry-attachment-choice"
summary = "While the permanent spell remains on the stack, offer its controller a public 0-or-1 non-targeting choice from legal controlled creatures; if selected, enter and attach before capturing ETB triggers or checking state-based actions. If declined, enter unattached."
trace_required = true

[[features]]
