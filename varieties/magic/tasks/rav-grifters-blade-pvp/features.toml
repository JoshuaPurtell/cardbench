[source_reconciliation]
printed_wording = "The RAV printing describes Grifter's Blade entering equipped to a creature of its controller's choice."
oracle_wording = "Current Oracle wording states the as-enters choice explicitly and allows the Equipment to enter unattached when no choice is made."
semantic_difference = "The current template clarifies entry timing. Both wordings are non-targeting and create no ETB trigger, target, stack object, or response window. This task implements the printed entry choice and rejects the former target-bearing model."
subtype_limit = "The printed type line includes Equipment; CardDefinition has no artifact-subtype field. Equipment is retained as public identity and asserted through AttachmentBinding metadata and behavior."
engine_limit = "EntryAttachmentBinding currently suspends only a permanent spell resolving from the stack. Direct noncast battlefield entries are not implemented by this vertical."

