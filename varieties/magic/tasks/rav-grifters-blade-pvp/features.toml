trace_required = true

[[features]]
id = "equipment-subtype-schema-boundary"
summary = "Retain Equipment as printed identity and verify Equipment behavior through attachment metadata; CardDefinition does not assert artifact subtypes directly."
trace_required = true

[[features]]
