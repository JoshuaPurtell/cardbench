[[features]]
id = "blue-instant-and-targeted-cast"
summary = "Cast Convolute as a blue instant for {2}{U}, targeting the exact opposing spell on the stack in a legal response window."
trace_required = true

[[features]]
id = "controller-owned-resolution-payment"
summary = "Separate full-game traces exercise both choices at resolution: a target controller explicitly declines {4} and another target controller explicitly pays {4} using four listed mana abilities."
trace_required = true

[[features]]
id = "counter-provenance-and-zone-cleanup"
summary = "The decline trace records Convolute countering only the chosen spell and moving it to its owner's graveyard; the pay trace proves the spell resolves and enters the battlefield instead."
trace_required = true

[[features]]
id = "terminal-pvp-and-deterministic-replay"
summary = "Continue the same shuffled 60-card game to a seat-zero Watchwolf combat win and require event-identical replay for the selected seed."
trace_required = true

[[features]]
id = "semantic-mutation-detection"
summary = "Reject a changed four-mana payment, changed blue spell identity, or unconditional counter effect."
trace_required = true

