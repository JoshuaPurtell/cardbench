[[features]]
id = "aura-enchant-creature"
summary = "Verify Followed Footsteps enters as an Aura and legally attaches to the chosen creature, recording the attached object's incarnation."
trace_required = true

[[features]]
id = "aura-controller-upkeep-scope"
summary = "Verify the ability triggers on the Aura controller's upkeep, including when a different player controls the enchanted creature; the enchanted creature controller's upkeep does not trigger it."
trace_required = true

[[features]]
id = "trigger-and-token-control"
summary = "Verify the Aura controller controls the triggered ability and receives each created token, independently of the enchanted creature's controller."
trace_required = true

[[features]]
id = "layer-one-token-copy-provenance"
summary = "Verify each token is a copy of the exact attached Watchwolf object incarnation and retains its copied 3/3 characteristics."
trace_required = true

[[features]]
id = "repeated-upkeep-full-game"
summary = "Verify multiple upkeep/trigger/token/copy/resolution sequences are ordered before a deterministic terminal full-game PvP result and that source, attachment, scope, and effect mutations fail."
trace_required = true

