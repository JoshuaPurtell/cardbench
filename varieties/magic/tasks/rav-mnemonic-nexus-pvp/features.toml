[[features]]
id = "blue-instant-and-exact-payment"
summary = "Cast Mnemonic Nexus at instant speed from a shuffled legal deck and pay exactly four mana including its blue symbol."
trace_required = true

[[features]]
id = "each-player-own-graveyard"
summary = "At casting, both players have a distinct Rain of Embers in their own graveyards; every card in each graveyard moves to that owner's library."
trace_required = true

[[features]]
id = "both-library-shuffles"
summary = "Observe a library shuffle for seat zero and seat one after the corresponding owner-relative graveyard recovery."
trace_required = true

[[features]]
id = "resolving-instant-not-shuffled"
summary = "Confirm Mnemonic Nexus is absent from the graveyard contents moved by its own effect and reaches its owner's graveyard only after resolving."
trace_required = true

[[features]]
id = "terminal-pvp-and-deterministic-replay"
summary = "Continue the same legal 60-card PvP game through combat to a normal terminal pilot win and replay the ordered event trace deterministically."
trace_required = true

[[features]]
id = "literal-source-guard-and-mutations"
summary = "Reject wrong cost, wrong color, and missing-shuffle-effect variants before granting diagnostic success."
trace_required = true

