[[features]]
id = "shuffled-game-cast-and-entry"
summary = "In an ordinary shuffled two-player match, cast Ordruun Commando from its library with a paid {3}{R} cost and resolve the 4/1 creature onto the battlefield."
trace_required = true

[[features]]
id = "white-activation-payment-and-resolution"
summary = "During the opponent's attack turn, tap a Plains for white mana, pay {W}, activate the candidate-owned ability with no target or tap cost, and resolve it before the combat damage step."
trace_required = true

[[features]]
id = "live-combat-prevention-and-state-change"
summary = "A live opposing Elves of Deep Shadow attacks and is blocked by the Commando. The resolved shield prevents the exact 1 combat damage to Commando, its 4 combat damage kills the Elf, and the Elf moves to its graveyard while the Commando remains an undamaged 4/1."
trace_required = true

[[features]]
id = "later-combat-and-terminal-win"
summary = "The surviving Commando attacks in the same shuffled game, deals 4 combat damage to the opponent, and the game ends with a seat-zero win and no rejected policy moves."
trace_required = true

[[features]]
id = "targeted-ability-and-cost-mutations"
summary = "The trace rejects zero shield, a red instead of white activation cost, an added source tap cost, and a red-creature casting-cost mutation."
trace_required = true

