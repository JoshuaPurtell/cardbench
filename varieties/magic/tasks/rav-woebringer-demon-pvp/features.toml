[[features]]
id = "each-active-upkeep-choice"
summary = "At separate opponent and controller upkeeps, stack the same Demon trigger and open the mandatory creature choice for that upkeep's active player. That player selects a creature they control; record the choice completion, exact sacrifice, graveyard move, and ability resolution in order."
trace_required = true

[[features]]
