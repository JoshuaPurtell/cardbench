[[features]]
id = "any-enchantment-choice"
summary = "During resolution, the controller may select any live battlefield enchantment, including an opponent-controlled or untargetable enchantment. The choice does not target; the selected card moves to its owner's hand."
trace_required = true

[[features]]
id = "sacrifice-when-not-returned"
summary = "When the controller declines or no battlefield enchantment exists, the exact Drake Familiar source incarnation is sacrificed if it is still a permanent they control."
trace_required = true

