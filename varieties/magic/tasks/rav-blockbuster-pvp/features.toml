summary = "Cast the red Blockbuster enchantment for exactly {3}{R}{R} using three generic and two red mana, then verify its battlefield entry."
trace_required = true

[[features]]
id = "source-sacrifice-activation"
summary = "Pay {1}{R}, sacrifice Blockbuster as the activation cost, and move its source to its owner's graveyard before the targetless ability is put on the stack."
trace_required = true

[[features]]
id = "tapped-creature-and-both-player-damage"
summary = "Deal exactly 3 damage to every creature tapped immediately before resolution and to both players; leave each untapped creature undamaged. Apply lethal damage state-based actions after the full packet batch."
trace_required = true

[[features]]
id = "terminal-replay-and-mutation-sensitivity"
summary = "Reach a terminal result in a shuffled 60-card PvP game, reproduce the typed event trace for the same seed, and reject wrong activation cost, missing source sacrifice, and wrong global-damage amount."
trace_required = true

