[[features]]
id = "identity-cost-and-base-characteristics"
summary = "Cast RAV Moroii for exact {2}{U}{B} in a shuffled two-player 60-card duel; verify its blue-black creature identity, 4/4 base characteristics, and Flying."
trace_required = true

[[features]]
id = "flying-combat"
summary = "Attack with the resolved Moroii. The opponent's ground creature submits no legal block, and Moroii deals four combat damage to the opponent."
trace_required = true

[[features]]
id = "controller-upkeep-trigger"
summary = "Do not trigger during the opponent's upkeep; stack and resolve Moroii's `upkeep-lose-one-life` ability at its controller's upkeep, with the source incarnation preserved and exactly one life lost by that controller."
trace_required = true

[[features]]
id = "terminal-pvp-and-replay"
summary = "Continue the complete duel to a seat-zero win and reproduce the ordered event log for the same seed."
trace_required = true

[[features]]
id = "semantic-mutation-sensitivity"
summary = "Detect changed printed cost or base stats, removed Flying, and removal of the controller-upkeep trigger."
trace_required = true

