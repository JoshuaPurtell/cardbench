schema_version = "cardbench.magic.card-task.v1"
task_id = "cardbench/magic/card"
instance = "rav-quickchange"
definition_id = "RAV-QUICKCHANGE"
expansion = "RAV"
variant = "single-card"
bundle = "quickchange_card"
target_file = "varieties/magic/sets/ravnica_city_of_guilds/src/cards/quickchange.rs"
authority_bin = "rav-quickchange-pvp"
materializer = "varieties/magic/scripts/materialize_quickchange_task.py"
scorer = "varieties/magic/scripts/score_quickchange_pvp.py"
