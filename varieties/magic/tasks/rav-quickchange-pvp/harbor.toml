  "adapters/harbor/bundles/quickchange_card/README.md",
  "adapters/harbor/bundles/quickchange_card/instruction.md",
  "adapters/harbor/bundles/quickchange_card/tests/test.sh",
  "varieties/magic/scripts/materialize_quickchange_task.py",
  "varieties/magic/scripts/rav_card_task_workspace.py",
  "varieties/magic/scripts/score_quickchange_pvp.py",
  "varieties/magic/session/src/bin/rav_quickchange_pvp.rs",
  "varieties/magic/sets/ravnica_city_of_guilds/src/cards/quickchange.rs",
  "varieties/magic/tasks/rav-quickchange-pvp/README.md",
  "varieties/magic/tasks/rav-quickchange-pvp/features.toml",
  "varieties/magic/tasks/rav-quickchange-pvp/harbor.toml",
]
stub_expected_diagnostic = "Quickchange literal is outside the task source contract"

[mutation]
find = "ManaCost::with_colors(1, [Color::Blue])"
