[[features]]
id = "identity-and-candidate-owned-bindings"
summary = "Define the green {1}{G}{G} 2/3 creature with Dredge 2 and bind its mandatory graveyard-to-hand life-gain trigger in the candidate module. Lizard is retained printed subtype identity but is not asserted because CardDefinition has no creature-subtype field."
trace_required = true

[[features]]
id = "exact-dredge-two-and-life-trigger-order"
summary = "In legal combat, the pilot's Brownscale blocks an opposing Watchwolf and dies. Replace the pilot's next draw with Dredge 2; verify exactly two library objects move to the graveyard, then the same Brownscale object moves to hand, the Dredged receipt occurs, its graveyard-to-hand ability stacks and resolves, and exactly 2 life is gained."
trace_required = true

[[features]]
id = "recast-terminal-pvp-and-mutations"
summary = "Replay the deterministic shuffled 60-card duel and recast the returned Brownscale before a terminal result. Detect mutations to identity, cost, body, Dredge presence/count, trigger condition/effect/amount, and a compile-valid injected side-effect candidate before any candidate function executes."
trace_required = true

[[features]]
id = "pre-call-literal-source-guard"
summary = "Require the normalized parsed AST to equal the literal candidate module before invoking candidate functions; report rejection of a compile-valid injected side effect."
trace_required = true

