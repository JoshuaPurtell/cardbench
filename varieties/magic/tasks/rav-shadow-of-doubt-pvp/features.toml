summary = "Cast Shadow of Doubt as an instant using exactly two Blue/Black hybrid mana payments in a legal PvP game."
trace_required = true

[[features]]
id = "same-turn-global-library-search-prevention"
summary = "Resolve Shadow while an opponent's Farseek is on the stack, record the current turn, and prove its search finds no card while the prohibition is active."
trace_required = true

[[features]]
id = "ordered-controller-draw"
summary = "After recording the search-prevention effect, move exactly one card from the controller's library to hand before Shadow resolves."
trace_required = true

[[features]]
id = "expiration-and-later-search"
summary = "Resolve a later Farseek on a subsequent turn, privately select a legal Mountain, and verify the library is shuffled after each search."
trace_required = true

[[features]]
id = "terminal-full-game-replay-and-mutations"
summary = "Continue the shuffled 60-card duel through combat to a deterministic terminal seat-zero win; detect omitted prevention, omitted or duplicated draw, and reversed effect order."
trace_required = true

