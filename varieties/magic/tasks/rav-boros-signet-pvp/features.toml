summary = "Cast and resolve Boros Signet for its actual two-generic-mana cost in a legal 60-card PvP game."
trace_required = true

[[features]]
id = "paid-tap-mana-ability"
summary = "Pay exactly one generic mana and tap the Signet; the bound mana ability produces one red and one white mana in one non-stack bundle event."
trace_required = true

[[features]]
id = "actual-red-white-spell-payment"
summary = "Use the Signet's colored output to pay the red and white symbols of Skyknight Legionnaire and pay its remaining generic symbol from a land."
trace_required = true

[[features]]
id = "same-turn-haste-combat-and-terminal"
summary = "Resolve the live flying, haste 2/2 and declare it attacking in the same turn it is cast; complete the game to a terminal player-zero win and replay the full state and event stream deterministically."
trace_required = true

[[features]]
id = "targeted-bundle-mutation-and-stub"
summary = "Changing the Signet bundle from red-white to green-white and the compile-valid starter stub must fail the exact output gate in the live trace."
trace_required = true

