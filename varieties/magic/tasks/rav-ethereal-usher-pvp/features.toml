[[features]]
id = "unblockable-activation-target-and-duration"
summary = "Pay {U}, tap the Usher, target the pilot's exact Watchwolf, resolve its unblockable effect, reject a real opposing Watchwolf's attempted block, and observe expiration next turn."
trace_required = true

[[features]]
id = "transmute-private-search-and-shuffle"
summary = "At active-player precombat main with an empty stack, pay {1}{U}{U}, discard the source, privately find and reveal a second physical Ethereal Usher by equal mana value, move it to hand, and shuffle."
trace_required = true

[[features]]
id = "terminal-game-replay-and-mutations"
summary = "Continue to a normal seat-zero victory, require ordered projected events and identical replay, and detect changes to cast cost/body, activation cost/effect, and Transmute presence/cost."
trace_required = true

[[features]]
