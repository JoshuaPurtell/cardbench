[[features]]
id = "black-creature-cast-and-trample"
summary = "Cast the black 7/7 Horror for exactly {B}{B}; check its live Trample keyword and ordered combat assignment of lethal damage to Watchwolf plus excess damage to its controller. The Horror subtype is retained as identity but is not modeled or asserted by CardDefinition."
trace_required = true

[[features]]
id = "opponent-centaur-etb"
summary = "Record exactly one target-selection policy receipt from the trigger controller, bound to Hunted Horror's source and controller, and target only the opposing player. Create exactly two green 3/3 Centaur creature tokens with Protection from Black under that opponent's control."
trace_required = true

[[features]]
id = "protection-from-black-block-boundary"
summary = "Probe a Centaur block of the black Horror, require the rules engine to reject it without changing state, then continue the legal game with the Watchwolf block."
trace_required = true

[[features]]
id = "deterministic-replay-and-semantic-controls"
summary = "Replay the full constructed duel deterministically; reject mutations to the body, Trample, ETB trigger, opponent-only target, Centaur protection/count, and exact black mana cost; and reject a compile-valid source mutation that exits successfully before invoking candidate functions."
trace_required = true

[[features]]
id = "candidate-source-side-effect-guard"
summary = "Parse and compare the exact normalized candidate AST before calling any candidate function; a compile-valid injected process exit must be rejected before candidate execution or game/report generation."
trace_required = true

