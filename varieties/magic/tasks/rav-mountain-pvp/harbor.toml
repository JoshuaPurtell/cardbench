stub_expected_diagnostic = "candidate Mountain definition or intrinsic mana binding differs from its RAV identity"

[mutation]
find = "land_type: BasicLandType::Mountain"
replace = "land_type: BasicLandType::Forest"
expected_diagnostic = "candidate Mountain definition or intrinsic mana binding differs from its RAV identity"
