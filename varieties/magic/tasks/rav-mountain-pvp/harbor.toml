schema_version = "cardbench.magic.card-task.v1"
task_id = "cardbench/magic/card"
instance = "rav-mountain"
definition_id = "RAV-MOUNTAIN"
expansion = "RAV"
variant = "single-card"
bundle = "mountain_card"
target_file = "varieties/magic/sets/ravnica_city_of_guilds/src/cards/mountain.rs"
authority_bin = "rav-mountain-pvp"
materializer = "varieties/magic/scripts/materialize_mountain_task.py"
scorer = "varieties/magic/scripts/score_mountain_pvp.py"
review_scope = "RAV Mountain identity, intrinsic red mana, full-game PvP trace, materialization, and Harbor scoring"
review_files = [
  "adapters/harbor/bundles/mountain_card/README.md",
  "adapters/harbor/bundles/mountain_card/instruction.md",
  "adapters/harbor/bundles/mountain_card/tests/test.sh",
  "adapters/harbor/scripts/run_harbor.py",
  "varieties/magic/DATA_PROVENANCE.md",
  "varieties/magic/README.md",
  "varieties/magic/Cargo.lock",
  "varieties/magic/Cargo.toml",
  "varieties/magic/scripts/materialize_mountain_task.py",
  "varieties/magic/scripts/rav_card_task_workspace.py",
  "varieties/magic/scripts/score_mountain_pvp.py",
  "varieties/magic/session/Cargo.toml",
  "varieties/magic/session/src/project.rs",
  "varieties/magic/session/src/bin/rav_mountain_pvp.rs",
  "varieties/magic/engine/src/game.rs",
  "varieties/magic/engine/src/model.rs",
  "varieties/magic/sets/ravnica_city_of_guilds/src/cards/mountain.rs",
  "varieties/magic/sets/ravnica_city_of_guilds/src/cards/mod.rs",
  "varieties/magic/sets/ravnica_city_of_guilds/src/lib.rs",
  "varieties/magic/sets/ravnica_city_of_guilds/catalog/rav_main_set.tsv",
  "varieties/magic/tasks/rav-set-pvp/RAV_PVP_SOURCE_CONTRACT.md",
  "varieties/magic/tasks/rav-mountain-pvp/README.md",
  "varieties/magic/tasks/rav-mountain-pvp/features.toml",
  "varieties/magic/tasks/rav-mountain-pvp/harbor.toml",
