[[features]]
id = "paid-tap-mana-ability"
summary = "Pay exactly one generic mana and tap the Signet; its bound mana ability creates exactly one green and one white mana in one non-stack bundle event."
trace_required = true

[[features]]
id = "actual-green-white-spell-payment"
summary = "Spend the Signet's actual green and white output to pay Watchwolf's green and white symbols, with no generic Watchwolf cost."
trace_required = true

[[features]]
id = "live-creature-combat-terminal-replay"
summary = "Resolve Watchwolf as a live vanilla 3/3, attack no earlier than the following turn, finish with a terminal player-zero win, and reproduce the full state and event stream deterministically."
trace_required = true

[[features]]
id = "wrong-bundle-mutation-and-stub"
summary = "The authority's wrong-color bundle mutation and compile-valid red-white starter stub both compile and fail the live green-white output/payment gate."
trace_required = true

