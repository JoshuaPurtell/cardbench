[[features]]
id = "red-white-cost-and-targeted-cast"
summary = "Cast Rally the Righteous from a shuffled library at instant speed after declaring two Boros Swiftblades as attackers, pay Red, White, and Red, and confirm the chosen Swiftblade is a legal target on the live stack."
trace_required = true

[[features]]
id = "radiance-untap-and-pump"
summary = "Resolve Radiance on the target and its same-color attacker; verify both attackers untap and each is a live 3/2 before blockers."
