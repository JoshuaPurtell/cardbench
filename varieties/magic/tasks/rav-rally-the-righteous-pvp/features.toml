[[features]]
id = "first-strike-combat-outcome"
summary = "The target Swiftblade is blocked by a mono-green 2/3. Its first-strike damage kills the blocker before normal damage, while the unblocked Swiftblade deals three damage in both combat damage steps and wins the shuffled game."
trace_required = true

[[features]]
