[[features]]
id = "colorless-artifact-cast"
summary = "Cast and resolve Golgari Signet for its printed two-generic-mana cost in a legal 60-card PvP game."
trace_required = true

[[features]]
id = "paid-tap-mana-ability"
summary = "Pay exactly one generic mana and tap the Signet; its bound mana ability creates exactly one black and one green mana in one non-stack bundle event."
trace_required = true

[[features]]
id = "actual-black-green-spell-payment"
summary = "Spend the Signet's black output on Roofstalker Wight's black symbol and its green output on the Wight's generic symbol in the actual `{1}{B}` payment."
trace_required = true

[[features]]
id = "live-creature-combat-terminal-replay"
summary = "Resolve Roofstalker Wight as a live vanilla 2/1, attack on a later turn, finish with a terminal player-zero win, and reproduce the full state and event stream deterministically."
trace_required = true

[[features]]
id = "wrong-bundle-mutation-and-stub"
summary = "The authority's wrong-color bundle mutation and compile-valid red-black starter stub both compile and fail the live black-green output/payment gate."
trace_required = true

