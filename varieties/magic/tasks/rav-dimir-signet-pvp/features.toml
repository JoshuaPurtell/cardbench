[[features]]
id = "colorless-artifact-cast"
summary = "Cast and resolve Dimir Signet for its printed two-generic-mana cost in a legal 60-card PvP game."
trace_required = true

[[features]]
id = "paid-tap-mana-ability"
summary = "Pay exactly one generic mana and tap the Signet; its bound mana ability creates exactly one blue and one black mana in one non-stack bundle event."
trace_required = true

[[features]]
id = "actual-blue-black-spell-payment"
summary = "Spend the Signet's actual blue and black output to pay Dimir Infiltrator's blue and black symbols, with no generic Infiltrator cost."
trace_required = true

[[features]]
id = "live-creature-combat-terminal-replay"
summary = "Resolve Dimir Infiltrator as a live 1/3 with its printed unblockable and transmute characteristics, attack on a later turn, finish with a terminal player-zero win, and reproduce the full state and event stream deterministically."
trace_required = true

[[features]]
id = "wrong-bundle-mutation-and-stub"
summary = "The authority's wrong-color bundle mutation and compile-valid red-black starter stub both compile and fail the live blue-black output/payment gate."
trace_required = true

