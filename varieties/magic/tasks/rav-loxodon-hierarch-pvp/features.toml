id = "full-game-replay-and-mutations"
summary = "The legal full-game duel ends in a Player 0 win, replays deterministically, and detects an omitted/wrong entry trigger, wrong activation cost/effect, missing binding, and parse-valid side-effect injection."
trace_required = true

