[[features]]
id = "paid-sacrifice-activation"
summary = "After the opponent casts Char at a controlled Watchwolf, pay one Green and one White, sacrifice the Hierarch as the activation cost, and resolve its ability."
trace_required = true

[[features]]
id = "controller-creatures-regenerate"
summary = "At resolution, each then-controlled creature gets its own regeneration shield; no opponent creature gets one, and lethal Char damage consumes exactly the targeted Watchwolf shield."
trace_required = true

