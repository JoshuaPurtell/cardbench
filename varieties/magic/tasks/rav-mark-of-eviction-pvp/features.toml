[[features]]
id = "identity-and-cost"
summary = "Cast Mark of Eviction as a blue {U} enchantment Aura in a shuffled two-player 60-card duel."
trace_required = true

[[features]]
id = "creature-aura-attachment"
summary = "Target and attach Mark to the opponent's War-Torch Goblin; preserve the exact Aura and creature identities."
trace_required = true

[[features]]
id = "controller-upkeep-trigger"
summary = "Allow the opponent's upkeep to pass without triggering Mark, then stack and resolve the return trigger during Mark's controller's later upkeep."
trace_required = true

[[features]]
id = "owner-zones-and-state-based-action"
summary = "At the Aura controller's upkeep, return the enchanted creature and every Aura attached to it to their respective owners' hands."
trace_required = true

[[features]]
id = "terminal-pvp-and-replay"
summary = "Continue the full duel to a seat-zero win and reproduce the ordered event log for the same seed."
trace_required = true

[[features]]
id = "semantic-mutation-sensitivity"
summary = "Removing attachment or the upkeep trigger, changing its controller condition or return instruction, or changing the cost must fail the gameplay oracle."
trace_required = true

