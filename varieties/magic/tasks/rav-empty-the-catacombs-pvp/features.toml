[[features]]
id = "black-sorcery-and-exact-payment"
summary = "Cast Empty the Catacombs as a sorcery from a shuffled legal deck and pay exactly four mana including black."
trace_required = true

[[features]]
id = "every-creature-card-from-each-graveyard"
summary = "Each player has at least two creature cards in their own graveyard before casting, and every such card returns to its owner's hand."
trace_required = true

[[features]]
id = "noncreature-cards-stay"
summary = "A noncreature spell remains in its owner's graveyard while every eligible creature card leaves; the sorcery itself reaches its owner's graveyard only after resolving."
trace_required = true

[[features]]
id = "no-graveyard-card-selection"
summary = "The all-creature effect resolves without the old one-card-per-player public choice prompt."
trace_required = true

[[features]]
id = "terminal-pvp-and-deterministic-replay"
summary = "Continue the same legal 60-card PvP game through combat to a normal terminal pilot win and replay the ordered event trace deterministically."
trace_required = true

[[features]]
id = "literal-source-guard-and-mutations"
summary = "Reject wrong cost, wrong color, and missing all-creature-return effect variants before diagnostic success."
trace_required = true

