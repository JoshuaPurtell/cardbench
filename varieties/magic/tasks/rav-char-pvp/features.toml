[[features]]
id = "card-identity-and-cast"
summary = "Represent the RAV identity as a red instant with the printed mana cost; legal full-game casting enters the normal stack and priority lifecycle."
trace_required = true

[[features]]
id = "player-or-creature-target"
summary = "The first instruction selects one legal player or creature target; the chosen target receives four damage on resolution."
trace_required = true
branches = ["player", "opponent-creature"]

[[features]]
id = "controller-damage"
summary = "After the first damage instruction, the spell's controller receives two damage."
trace_required = true

[[features]]
id = "ordered-resolution-and-zone-change"
summary = "The spell resolves its ordered instructions, completes resolution, and then moves from the stack to its owner's graveyard."
trace_required = true

