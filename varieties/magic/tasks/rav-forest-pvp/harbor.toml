stub_expected_diagnostic = "candidate Forest definition or intrinsic mana binding differs from its RAV identity"

[mutation]
find = "land_type: BasicLandType::Forest"
replace = "land_type: BasicLandType::Mountain"
expected_diagnostic = "candidate Forest definition or intrinsic mana binding differs from its RAV identity"
