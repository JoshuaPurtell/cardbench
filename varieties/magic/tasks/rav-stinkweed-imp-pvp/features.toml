[[features]]
id = "identity-and-candidate-owned-bindings"
summary = "Define the black {2}{B} 1/2 creature with Flying and Dredge 5, and bind its mandatory combat-damage trigger in the candidate module. Imp is retained printed subtype identity but is not modeled or asserted by CardDefinition."
trace_required = true

[[features]]
id = "damage-recipient-provenance-and-destruction"
summary = "In legal combat, Stinkweed Imp blocks Watchwolf, deals exactly 1 combat damage to that exact object, and its resolved trigger destroys the same object. Capture combat damage, trigger stack/resolution, destruction, and graveyard state in event order."
trace_required = true

[[features]]
id = "exact-dredge-five-replacement"
summary = "After Stinkweed Imp dies and is in its owner's graveyard, replace one actual draw with Dredge 5. Verify the five exact library-top objects move to the graveyard in order, then this same Imp object returns to hand and is recast."
trace_required = true

[[features]]
id = "deterministic-terminal-pvp-and-mutations"
summary = "Replay the shuffled 60-card duel deterministically and continue to a terminal result. Detect mutations to cost, body, Flying, Dredge presence/count, trigger condition/effect, and a compile-valid injected process-exit candidate before any candidate function executes."
trace_required = true

[[features]]
id = "pre-call-literal-source-guard"
summary = "Require the normalized parsed AST to match the literal candidate module before invoking any candidate function; report rejection of a compile-valid injected side effect."
trace_required = true

