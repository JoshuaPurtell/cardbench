[[features]]
id = "blue-instant-and-targeted-cast"
summary = "Cast the blue {2}{U}{U} instant during the opposing Carven Caryatid spell's response window and target that exact physical spell."
trace_required = true

[[features]]
id = "counter-provenance-and-normal-zone"
summary = "Record Induce Paranoia countering only the chosen target, followed by that target's move to its owner's graveyard and the source spell's normal terminal move."
trace_required = true

[[features]]
id = "black-spent-mana-value-mill"
summary = "When Black was actually spent on Induce Paranoia, mill exactly three cards because the target spell has mana value 3; compare their identities and order to the target controller's library-top snapshot before the response."
trace_required = true

[[features]]
id = "no-black-control"
summary = "With the same target spell and no Black spent, counter it without moving any card from the target controller's library to the graveyard."
trace_required = true

[[features]]
id = "terminal-pvp-replay-and-mutations"
summary = "Continue both shuffled 60-card games to a seat-zero win, require deterministic replay, and detect removal of conditional milling, a changed mana-color condition, and a changed spell cost."
trace_required = true

[[features]]
id = "pre-call-source-validation"
summary = "Validate normalized candidate source and literal AST shape before candidate calls; reject an injected compile-valid side-effect function."
trace_required = true

