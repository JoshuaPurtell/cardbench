[[features]]
id = "opposing-live-flyer"
summary = "Cast a real opposing Skyknight Legionnaire with red, white, and generic mana so the challenged blocker has Flying and is live."
trace_required = true

[[features]]
id = "activated-blocking-restriction"
summary = "Pay red to target the Skyknight, resolve the activated ability and its source-relative continuous effect, then reject its block without changing the event log."
trace_required = true

[[features]]
id = "combat-and-terminal-state"
summary = "Accept empty blockers after the rejected block, record Griffin's combat damage, and finish the constructed PvP game at a terminal result."
trace_required = true

[[features]]
id = "semantic-mutation-and-stub"
summary = "Replacing the blocking restriction with an unrelated target +1/+1 effect, and a compile-valid stub with that effect, must both reach and fail the target-blocking combat gate."
trace_required = true

[[features]]
id = "deterministic-replay"
summary = "Replaying the seeded match reproduces the same ordered events, object identities, and terminal state."
trace_required = true

