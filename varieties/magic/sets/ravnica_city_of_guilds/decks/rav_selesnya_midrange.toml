# Efficient bodies and one piece of catch-all removal, built to win on board
# rather than on speed. Birds of Paradise is the only accelerant the planner
# can actually use: the signets need a nested payment solve it does not do.
#
# Faith's Fetters is the removal. It is an aura whose restriction lives in its
# continuous changes rather than its keyword list, which is exactly the case
# that would make a naive planner attach it to its own creature.

