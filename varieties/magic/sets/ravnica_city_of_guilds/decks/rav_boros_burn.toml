# An honest caveat, recorded here rather than implied by the name: Ravnica:
# City of Guilds base set contains exactly two burn spells that can be pointed
# at a player -- Char and Lightning Helix. There is no classic burn deck in
# this pool. This is the closest the card pool allows: maximum direct damage,
# plus evasive and repeatable damage sources, with a lower creature count and a
# heavier red base than the aggro list.
#
# The measurable difference between this and rav_boros_aggro is therefore
# partly card composition and partly the archetype objective: burn weights
# opponent life at 1.1 against aggro's 0.75 and points its reach at the face.

