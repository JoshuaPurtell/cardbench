# A second midrange deck, in different colours from the Selesnya list, so a
# policy change cannot be judged on one deck's quirks. Ravnica: City of Guilds
# has no Gruul -- that guild arrives in Guildpact -- so the black/green pair is
# the available contrast to green/white.
#
# Putrefy is the removal: unconditional, instant speed, and it targets an
# artifact or creature, which exercises a different target requirement than
# Selesnya's aura-based answer.

