[workspace]
resolver = "2"
members = [
  "engine",
  "policies",
  "protocol",
  "sets/ravnica_city_of_guilds",
]
default-members = [
  "engine",
  "policies",
  "protocol",
  "sets/ravnica_city_of_guilds",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["CardBench contributors"]
repository = "https://github.com/JoshuaPurtell/cardbench"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
