[family]
name = "crystal_guardians"
description = "Crystal Guardians benchmark family and curriculum variants."
engine_module = "cg"
task_name = "setbench-v1-crystal-guardians"
eval_host_file = "cards"
readiness = "ready"

[engine_core]
commit = "9d2a9f33c48ec155b626e8858d330e72e73b17fb"

[[graded_files]]
name = "cards"
gold = "source/gold/all_cards.rs"
stub = "source/stubs/all_cards.rs"
workspace_path = "scaffold/src/cg/all_cards.rs"

[[graded_files]]
name = "engine"
gold = "source/gold/cg_engine.rs"
stub = "source/stubs/cg_engine.rs"
workspace_path = "tcg_core/src/cg_engine.rs"

[public]
data_dir = "source/public/data"
train_dir = "source/public/train"
train_runtime = "source/public/train/train_runtime_eval.rs"
train_scenarios = "source/public/train/train_scenarios.json"

[hidden]
dir = "source/hidden"
runtime = "source/hidden/heldout_runtime_eval.rs"
scenarios = "source/hidden/heldout_scenarios.json"

[task]
dir = "source/task"

[variants.0pct]
description = "No public gold disclosure. Both graded files are fully stubbed."

[variants.0pct.files.cards]
source = "stub"

[variants.0pct.files.engine]
