version = "1.0"

[metadata]
author_name = "Josh Purtell"
author_email = "josh@usesynth.ai"
category = "code_generation"
benchmark = "terminal-bench-3"
set = "pokemon"
instance_id = "setbench-v1-dragon-frontiers"
difficulty = "hard"
tags = ["rust", "pokemon", "tcg", "setbench", "dragon-frontiers", "multi-file"]
environment = "tb3-engine-bench-base"

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 150

[environment]
build_timeout_sec = 1200
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0

[task]
task_name = "setbench-v1-dragon-frontiers"
graded_files = ["scaffold/src/df/import_specs.rs", "scaffold/src/df/runtime.rs"]
slice = "dynamic-replay"
train_scenarios = 12
hidden_scenarios = 12
